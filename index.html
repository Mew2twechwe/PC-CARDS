<!doctype html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>PC-CARDS | Boutique PC</title>
    <meta
      name="description"
      content="PC-CARDS, boutique de PC Gamer et de PC Limited Edition."
    />
    <link
      rel="icon"
      type="image/svg+xml"
      href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' fill='%23ffffff'/%3E%3Crect x='10' y='16' width='44' height='28' rx='2' fill='none' stroke='%23000000' stroke-width='5'/%3E%3Cpath d='M24 52h16M32 44v8' stroke='%23000000' stroke-width='5' stroke-linecap='round'/%3E%3C/svg%3E"
    />
    <link rel="stylesheet" href="./styles.css?v=3" />
  </head>

  <body>
    <header class="site-header">
      <a class="brand" href="#accueil" aria-label="PC-CARDS accueil">
        <video
          class="logo-video"
          id="logoVideo"
          autoplay
          muted
          playsinline
          preload="auto"
          data-loop-end="6"
        >
          <source src="./assets/logo-loop.mp4" type="video/mp4" />
        </video>
        <span class="brand-name">PC-CARDS</span>
      </a>

      <nav class="main-nav" aria-label="Navigation principale">
        <a href="#accueil">Accueil</a>
        <div class="catalogue-menu">
          <button
            class="nav-button"
            id="catalogueToggle"
            type="button"
            aria-expanded="false"
            aria-controls="cataloguePanel"
          >
            Catalogue
          </button>
          <div class="catalogue-panel" id="cataloguePanel">
            <button
              class="pc-toggle"
              id="pcToggle"
              type="button"
              aria-expanded="false"
              aria-controls="pcOptions"
            >
              PC
            </button>
            <div class="pc-options" id="pcOptions">
              <button type="button" data-filter="all">Tout voir</button>
              <button type="button" data-filter="limited">Limited Edition</button>
              <button type="button" data-filter="gamer">PC GAMER</button>
            </div>
          </div>
        </div>
        <a href="#catalogue">Selection</a>
        <a href="#contact">Contact</a>
      </nav>

      <button class="cart-button" type="button" aria-label="Panier">
        Panier <span id="cartCount">0</span>
      </button>
    </header>

    <main id="accueil">
      <section class="banner" aria-label="Banniere PC-CARDS">
        <video class="banner-video" autoplay muted loop playsinline preload="auto">
          <source src="./assets/banner.mp4" type="video/mp4" />
        </video>
      </section>

      <section class="intro-strip" aria-label="Avantages PC-CARDS">
        <div>
          <strong>PC verifies</strong>
          <span>Configurations equilibrees et composants selectionnes.</span>
        </div>
        <div>
          <strong>Series courtes</strong>
          <span>Des editions limitees avec un style sobre.</span>
        </div>
        <div>
          <strong>Gaming ready</strong>
          <span>Des machines pensees pour le jeu et le streaming.</span>
        </div>
      </section>

      <section class="catalogue-section" id="catalogue">
